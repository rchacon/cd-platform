[project]
name = "cd-etl"
version = "0.3.1"
description = "ETL process for members of congress"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18",
    "apache-airflow>=3.3.0",
    "apache-airflow-providers-fab>=3.8.0",
    "apache-airflow-providers-postgres>=6.8.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
