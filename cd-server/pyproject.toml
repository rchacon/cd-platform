[project]
name = "cd-server"
version = "0.1.0"
description = "GraphQL backend for cd-webapp"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "strawberry-graphql[fastapi]>=0.240.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
