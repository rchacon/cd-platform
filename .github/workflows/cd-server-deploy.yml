name: cd-server deploy

on:
  push:
    tags:
      - 'cd-server-v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag version matches pyproject.toml
        id: version
        run: scripts/check-tag-version.sh "$GITHUB_REF_NAME" cd-server-v cd-server/pyproject.toml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cd-server/docker/Dockerfile
          target: production
          push: true
          build-args: |
            CD_SERVER_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cd-server:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/cd-server:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::658430303091:role/cd-platform-cd-server-deploy
          aws-region: us-west-2

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster cd-platform-cd-server \
            --service cd-platform-cd-server \
            --force-new-deployment
