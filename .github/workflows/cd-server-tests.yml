name: cd-server tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U postgres && break
            sleep 1
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # cd.api's tests (tests/api/) seed and query congressional_app_test,
      # whose schema is owned by cd-etl -- apply it there first (the same
      # step the retired cd-api-tests.yml ran). --no-project skips cd-etl's
      # own lockfile and its whole apache-airflow dependency tree:
      # migrations/env.py has no ORM models and no import on cd-etl's src,
      # so alembic + psycopg2 is all this needs.
      - name: Apply cd-etl migrations to congressional_app_test
        working-directory: cd-etl
        env:
          PGDATABASE: congressional_app_test
        run: uv run --no-project --with alembic --with psycopg2-binary alembic upgrade head

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cd-server/docker/Dockerfile
          target: development
          tags: cd-server:dev
          load: true
          cache-from: type=gha,scope=cd-server-development
          cache-to: type=gha,mode=max,scope=cd-server-development

      - name: Run tests
        run: make test-server

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U postgres && break
            sleep 1
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cd-server/docker/Dockerfile
          target: production
          tags: cd-server:production
          load: true
          cache-from: type=gha,scope=cd-server-production
          cache-to: type=gha,mode=max,scope=cd-server-production

      - name: Smoke test production image
        run: |
          # --network container:$POSTGRES_CID (not standalone -p 8000:8000)
          # -- the no-arg entrypoint path runs `alembic upgrade head`, so
          # this needs a reachable Postgres to start at
          # all. PG* env vars deliberately omitted -- settings.py's
          # defaults (PGHOST=localhost, PGDATABASE=cd_customers,
          # PGUSER/PGPASSWORD=postgres) already match this
          # network-namespace-shared postgres service, same trick
          # cd-etl-tests.yml's own smoke test already uses.
          # CD_SERVER_ENVIRONMENT/COGNITO_* are also unset -- defaults to
          # "local", disabling JWT verification, same zero-AWS-setup
          # posture as local dev.
          POSTGRES_CID=$(docker compose ps -q postgres)
          docker run --rm -d --name cd-server-smoke \
            --network container:$POSTGRES_CID \
            cd-server:production

          # No published port to curl from the runner anymore (-p and
          # --network container:X are mutually exclusive, and this slim
          # image has no `curl` either) -- every check below runs via
          # `docker exec` + Python's own urllib instead, same as
          # cd-etl-tests.yml's own smoke test does for the identical
          # reason.
          healthy=false
          for i in $(seq 1 30); do
            docker exec cd-server-smoke uv run python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" \
              2>/dev/null && { healthy=true; break; }
            sleep 1
          done

          echo "::group::cd-server-smoke container logs"
          docker logs cd-server-smoke
          echo "::endgroup::"

          if [ "$healthy" != "true" ]; then
            echo "::error::cd-server never responded to a health check"
            docker rm -f cd-server-smoke
            exit 1
          fi

          docker exec cd-server-smoke uv run python -c "
          import json
          import urllib.request

          def post(query):
              req = urllib.request.Request(
                  'http://localhost:8000/graphql',
                  data=json.dumps({'query': query}).encode(),
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              return urllib.request.urlopen(req).read().decode()

          assert '\"version\"' in post('{ version }')

          with urllib.request.urlopen('http://localhost:8000/version') as r:
              assert b'\"version\"' in r.read()

          # cd.api's REST API, mounted at /v1 (no CD_SERVER_ENVIRONMENT
          # here, so OriginGuard runs in its local-dev pass-through mode).
          with urllib.request.urlopen('http://localhost:8000/v1/version') as r:
              assert b'\"version\"' in r.read()

          # Introspection must be off on the production image (schema.py
          # only adds DisableIntrospection when GRAPHIQL_ENABLED is unset,
          # which is the case here -- this image was built without it).
          assert 'introspection has been disabled' in post('{ __schema { queryType { name } } }')
          "

          docker rm -f cd-server-smoke

      # OriginGuard (cd/server/origin_guard.py) on the real production image,
      # in production mode: /v1 must only answer requests carrying API
      # Gateway's X-Origin-Verify secret, and must fail closed when that
      # secret isn't configured. The settings production mode makes
      # mandatory at import get placeholders -- nothing here calls Cognito or
      # Bedrock; only /health and /v1/version are hit.
      # The two containers run one after the other: --network container:
      # shares Postgres's network namespace, so both would bind :8000.
      - name: Smoke test /v1's origin guard in production mode
        run: |
          POSTGRES_CID=$(docker compose ps -q postgres)
          PROD_ENV="-e CD_SERVER_ENVIRONMENT=production -e CD_SERVER_MIGRATE_TASK=1
            -e AWS_DEFAULT_REGION=us-west-2 -e AWS_REGION=us-west-2
            -e COGNITO_USER_POOL_ID=us-west-2_smoke -e COGNITO_REGION=us-west-2
            -e COGNITO_CLIENT_IDS=smoke -e BEDROCK_CHAT_MODEL_ID=smoke-placeholder"

          # status <path> [Header:value ...] -> HTTP status from cds-guard
          status() {
            docker exec cds-guard uv run python -c "
          import sys, urllib.error, urllib.request
          headers = dict(h.split(':', 1) for h in sys.argv[2:])
          req = urllib.request.Request('http://localhost:8000' + sys.argv[1], headers=headers)
          try:
              print(urllib.request.urlopen(req).status)
          except urllib.error.HTTPError as e:
              print(e.code)
          " "$@"
          }

          start() {  # start [extra docker run args...]
            docker run --rm -d --name cds-guard --network container:$POSTGRES_CID \
              $PROD_ENV "$@" cd-server:production >/dev/null
            for i in $(seq 1 30); do
              [ "$(status /health 2>/dev/null)" = "200" ] && return 0
              sleep 1
            done
            echo "::error::cds-guard never became healthy"
            docker logs cds-guard
            exit 1
          }

          expect() {  # expect <status> <path> [headers...]
            got=$(status "${@:2}")
            if [ "$got" != "$1" ]; then
              echo "::error::${*:2}: expected $1, got $got"
              docker logs cds-guard
              docker rm -f cds-guard >/dev/null
              exit 1
            fi
            echo "ok: ${*:2} -> $got"
          }

          # 1. No secret configured: fails closed, whatever the request carries.
          start
          expect 200 /health
          expect 403 /v1/version
          expect 403 /v1/version "X-Origin-Verify:anything"
          if ! docker logs cds-guard 2>&1 | grep -q "CD_API_ORIGIN_SECRET is unset"; then
            echo "::error::no fail-closed warning logged"
            exit 1
          fi
          docker rm -f cds-guard >/dev/null

          # 2. Secret configured: only the matching header gets through.
          start -e CD_API_ORIGIN_SECRET=smoke-origin-secret
          expect 403 /v1/version
          expect 403 /v1/version "X-Origin-Verify:wrong"
          expect 200 /v1/version "X-Origin-Verify:smoke-origin-secret"
          expect 200 /health
          docker rm -f cds-guard >/dev/null

      - name: Smoke test the migrate subcommand and the skip path
        run: |
          # Both production-only entrypoint paths, neither of which the
          # health smoke test above exercises (it takes the no-arg local
          # branch). See cd-server/entrypoint.sh.
          POSTGRES_CID=$(docker compose ps -q postgres)

          # `entrypoint.sh migrate`: applies migrations, then exits 0 --
          # must NOT stay up as a server. --network container:X so
          # alembic can reach Postgres on settings.py's defaults. `set
          # -e` (the runner default) fails the step on a non-zero exit;
          # `timeout` turns a regression where `migrate` never returns
          # (falls through to `exec "$@"`) into a fast failure instead
          # of a job-timeout hang.
          timeout 120 docker run --rm --network container:$POSTGRES_CID \
            cd-server:production migrate

          # CD_SERVER_MIGRATE_TASK=1: the no-arg path skips the on-boot
          # `alembic upgrade head` (one-shot task owns it) but still
          # exec's the server, which must still come up healthy.
          docker run --rm -d --name cd-server-skip \
            --network container:$POSTGRES_CID \
            -e CD_SERVER_MIGRATE_TASK=1 \
            cd-server:production

          healthy=false
          for i in $(seq 1 30); do
            docker exec cd-server-skip uv run python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" \
              2>/dev/null && { healthy=true; break; }
            sleep 1
          done

          echo "::group::cd-server-skip container logs"
          docker logs cd-server-skip
          echo "::endgroup::"

          if [ "$healthy" != "true" ]; then
            echo "::error::cd-server with CD_SERVER_MIGRATE_TASK=1 never became healthy"
            docker rm -f cd-server-skip
            exit 1
          fi

          if ! docker logs cd-server-skip 2>&1 | grep -q "CD_SERVER_MIGRATE_TASK=1"; then
            echo "::error::skip path did not log that it skipped the on-boot migrate"
            docker rm -f cd-server-skip
            exit 1
          fi

          docker rm -f cd-server-skip
