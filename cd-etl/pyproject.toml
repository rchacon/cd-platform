[project]
name = "cd-etl"
version = "0.4.3"
description = "ETL process for members of congress"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18",
    "apache-airflow>=3.3.0",
    "apache-airflow-providers-fab>=3.8.0",
    "apache-airflow-providers-postgres>=6.8.0",
    # boto3 is a transitive dep via cd-lib (cd.lib.bedrock) -- cd-etl's
    # own code imports nothing from boto directly since bedrock moved.
    "cd-lib",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

# editable, like cd-server's own cd-lib source (also Docker-only) -- a
# container whose filesystem is stable between build and run. cd-api
# deliberately does NOT (its Lambda zip has no persistent source tree).
# See cd-lib/README.md's "Consuming it" section.
[tool.uv.sources]
cd-lib = { path = "../cd-lib", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
