name: cd-server deploy

on:
  push:
    tags:
      - 'cd-server-v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag version matches pyproject.toml
        id: version
        run: scripts/check-tag-version.sh "$GITHUB_REF_NAME" cd-server-v cd-server/pyproject.toml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: cd-server
          file: cd-server/docker/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cd-server:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/cd-server:latest
