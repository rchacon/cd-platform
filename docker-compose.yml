services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: congressional_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only runs on first container creation with an empty volume, same
      # caveat as this project's old init.sql mechanism -- creates the
      # separate airflow_metadata database Airflow's own metadata backend
      # uses below (matches how production's RDS instance is designed:
      # a sibling database on the same instance, not a separate one).
      - ./cd-etl/docker/init-airflow-metadata-db.sh:/docker-entrypoint-initdb.d/init-airflow-metadata-db.sh
      # Dedicated database `make test-etl` points at (see the Makefile) --
      # isolates tests from the real dev-seeded data and from `make
      # start-etl`'s long-running service, rather than racing the same
      # database (cd-platform#16).
      - ./cd-etl/docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh

  cd-etl:
    # Explicit tag (rather than Compose's default project-derived name) so
    # CI can pre-build this exact image with GHA layer caching and have
    # this service reuse it without rebuilding.
    image: cd-etl:dev
    build:
      context: ./cd-etl
      dockerfile: docker/Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONGRESS_API_KEY: ${CONGRESS_API_KEY}
      # Compose's internal DNS resolves service names -- "postgres" here,
      # not "localhost" -- since cd-etl now runs in its own container on
      # the same compose network rather than on the host.
      AIRFLOW_CONN_CONGRESSIONAL_POSTGRES: postgresql://postgres:postgres@postgres:5432/congressional_app
      # Matches production's design (RDS hosts a separate airflow_metadata
      # database) rather than Airflow's own SQLite default.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow_metadata
      # tests/test_upsert_sql.py's PG_DSN defaults to PGHOST=localhost,
      # which inside this container means itself, not the postgres
      # service -- only PGHOST needs overriding, every other PG_DSN
      # default already matches the postgres service's own config above.
      PGHOST: postgres
    ports:
      - "8080:8080"
    volumes:
      # Bind-mounted so DAG/test edits show up without rebuilding the
      # image, even though both are already baked into the `development`
      # target build above.
      - ./cd-etl/src:/app/src
      - ./cd-etl/tests:/app/tests
      # Named volume so Airflow's own logs (and anything else under
      # AIRFLOW_HOME not living in Postgres) persist across restarts.
      - cd_etl_airflow_home:/app/.airflow

  # No Postgres dependency yet -- v1 only exposes a health check and a
  # GraphQL version query, so nothing to migrate. Doubles as the ad-hoc
  # test runner (`docker compose run --rm cd-server uv run pytest tests/`,
  # what `make test-server` uses) and the long-running local service
  # (`docker compose up cd-server`), unlike cd-etl's split into a bare
  # ad-hoc service plus 4 real ones -- there's no migrate-vs-serve
  # distinction here to justify that split yet.
  cd-server:
    image: cd-server:dev
    build:
      # Repo root, not ./cd-server -- cd-server/docker/Dockerfile also
      # COPYs in cd-lib, a sibling directory Docker can't reach from a
      # narrower context. See that Dockerfile's own comment.
      context: .
      dockerfile: cd-server/docker/Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./cd-server/src:/app/src
      # Bind-mounted for the same reason cd-etl mounts both src/ and
      # tests/ (see its own comment above) -- without this, `docker
      # compose run --rm cd-server uv run pytest tests/` (what `make
      # test-server` uses) would run against whatever tests/ was baked
      # into the image at the last --build, not local edits.
      - ./cd-server/tests:/app/tests
      # Same live-edit convenience as the src mount above, for the
      # cd-lib code this service also depends on.
      - ./cd-lib/src:/cd-lib/src

volumes:
  postgres_data:
  cd_etl_airflow_home:
