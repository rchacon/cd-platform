services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: congressional_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only runs on first container creation with an empty volume, same
      # caveat as this project's old init.sql mechanism -- creates the
      # separate airflow_metadata database Airflow's own metadata backend
      # uses below (matches how production's RDS instance is designed:
      # a sibling database on the same instance, not a separate one).
      - ./cd-etl/docker/init-airflow-metadata-db.sh:/docker-entrypoint-initdb.d/init-airflow-metadata-db.sh
      # Dedicated database `make test-etl` points at (see the Makefile) --
      # isolates tests from the real dev-seeded data and from `make
      # start-etl`'s long-running services, rather than racing the same
      # database (cd-platform#16).
      - ./cd-etl/docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh

  # No restart policy, no published port, no long-running default command
  # -- kept only as a base for ad-hoc one-off commands against this image
  # (`docker compose run --rm cd-etl <cmd>`), e.g. `make test-etl`. The 4
  # real Airflow components live in their own services below, not this
  # one -- see AGENTS.md for why (rchacon/cd-infra#22: `airflow standalone`
  # bundles them as unsupervised sibling subprocesses of one process, so a
  # crashed scheduler doesn't crash the container and `restart:
  # unless-stopped` never notices).
  cd-etl:
    # Explicit tag (rather than Compose's default project-derived name) so
    # CI can pre-build this exact image with GHA layer caching and have
    # this service reuse it without rebuilding. Every other cd-etl-*
    # service below reuses this same image/build.
    image: cd-etl:dev
    build:
      context: ./cd-etl
      dockerfile: docker/Dockerfile
      target: development
    depends_on:
      postgres:
        condition: service_healthy
      # Protects any ad-hoc `docker compose run --rm cd-etl <cmd>`
      # invocation, not just the two wired into the Makefile, from running
      # against an unmigrated schema -- entrypoint.sh no longer migrates
      # unconditionally on every invocation the way it once did. Confirmed
      # empirically that `docker compose run` re-triggers a fresh
      # cd-etl-migrate run on *every* invocation of this service, not just
      # the first (unlike `docker compose up`, which would recognize an
      # already-exited-0 dependency and skip it) -- a harmless ~1s of
      # idempotent overhead per ad-hoc command, not a one-time cost.
      cd-etl-migrate:
        condition: service_completed_successfully
    environment:
      CONGRESS_API_KEY: ${CONGRESS_API_KEY}
      # Compose's internal DNS resolves service names -- "postgres" here,
      # not "localhost" -- since cd-etl now runs in its own container on
      # the same compose network rather than on the host.
      AIRFLOW_CONN_CONGRESSIONAL_POSTGRES: postgresql://postgres:postgres@postgres:5432/congressional_app
      # Matches production's design (RDS hosts a separate airflow_metadata
      # database) rather than Airflow's own SQLite default.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow_metadata
      # tests/test_upsert_sql.py's PG_DSN defaults to PGHOST=localhost,
      # which inside this container means itself, not the postgres
      # service -- only PGHOST needs overriding, every other PG_DSN
      # default already matches the postgres service's own config above.
      PGHOST: postgres
    volumes:
      # Bind-mounted so DAG/test edits show up without rebuilding the
      # image, even though both are already baked into the `development`
      # target build above.
      - ./cd-etl/src:/app/src
      - ./cd-etl/tests:/app/tests
      # Named volume so Airflow's own logs (and anything else under
      # AIRFLOW_HOME not living in Postgres) persist across restarts.
      - cd_etl_airflow_home:/app/.airflow

  # One-shot: applies both Airflow's own metadata migrations and this
  # project's own schema migrations (cd-etl/migrations/), then exits 0.
  # Every real component below depends on this exiting successfully
  # before it starts (entrypoint.sh's "migrate" branch), so migrations
  # always run exactly once per `docker compose up`, never redundantly on
  # every component's own start/restart -- meaningfully faster crash
  # recovery too, since a restarted cd-etl-scheduler skips straight to
  # `airflow scheduler` instead of re-running `alembic upgrade head` first.
  # Re-runs (harmlessly, idempotently) on every `docker compose up`, same
  # "no forgot-to-migrate state" guarantee the old single-container setup
  # had.
  #
  # Known gap in production specifically: this service exits immediately
  # after a successful run, so on a Watchtower-driven redeploy (see
  # AGENTS.md's Releasing section) it isn't "running" for Watchtower to
  # recreate the way the 4 long-running components below are -- a new
  # image's own schema migration may not get applied automatically by that
  # path. The old single-container design didn't have this gap (every
  # Watchtower-triggered restart re-ran migrate unconditionally, since it
  # was the same container). Needs a cd-infra-side fix (e.g. reviving
  # stopped containers on update, or a pre-deploy hook that runs this
  # service explicitly); not fixable from this compose file alone.
  cd-etl-migrate:
    image: cd-etl:dev
    build:
      context: ./cd-etl
      dockerfile: docker/Dockerfile
      target: development
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow_metadata
      # alembic upgrade head's own DSN (cd-etl/migrations/env.py) is built
      # from PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD, not the Airflow
      # var above -- only PGHOST needs overriding here, same as cd-etl's
      # own PGHOST override.
      PGHOST: postgres
      # Confirmed empirically: without these, `airflow db migrate` (the
      # first Airflow invocation against a fresh cd_etl_airflow_home
      # volume) auto-generates and persists its own random fernet_key/
      # secret_key/jwt_secret into the shared airflow.cfg -- values the 4
      # real components below never actually use (their own env vars take
      # precedence over the file), but a stray, inconsistent set of values
      # left on disk regardless. Pinned here too so every Airflow
      # invocation against this volume agrees, full stop, not just the
      # ones that happen to matter today.
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY}
    volumes:
      - cd_etl_airflow_home:/app/.airflow

  cd-etl-api-server:
    image: cd-etl:dev
    build:
      context: ./cd-etl
      dockerfile: docker/Dockerfile
      target: development
    command: ["uv", "run", "airflow", "api-server"]
    restart: unless-stopped
    depends_on:
      cd-etl-migrate:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow_metadata
      # Shared across every component in this file (generate once per
      # environment via .env.sample's instructions, not per component) --
      # sign/verify the Execution API's JWTs, encrypt/decrypt stored
      # Connection passwords, and sign this api-server's session cookies,
      # respectively.
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY}
      # congress_api.py reads this at *module import time*, not lazily --
      # every DAG file imports it, and every component below that ever
      # imports a DAG file (this one included, e.g. rendering the "Code"
      # view) hits a KeyError without it, confirmed empirically.
      CONGRESS_API_KEY: ${CONGRESS_API_KEY}
    ports:
      - "8080:8080"
    volumes:
      - ./cd-etl/src:/app/src
      - cd_etl_airflow_home:/app/.airflow
    healthcheck:
      # /api/v2/monitor/health always returns 200 (its body reports
      # per-component status) -- this only proves the api-server process
      # itself is alive and can reach the metadata DB, which is exactly
      # the failure mode this split is meant to catch. Other components'
      # own health is checked by their own healthcheck below, not this one.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cd-etl-scheduler:
    image: cd-etl:dev
    build:
      context: ./cd-etl
      dockerfile: docker/Dockerfile
      target: development
    command: ["uv", "run", "airflow", "scheduler"]
    restart: unless-stopped
    # Stable, Compose-DNS-resolvable hostname -- LocalExecutor forks task
    # subprocesses directly from this process, and Airflow records this
    # hostname per task instance so the api-server knows where to fetch a
    # *currently running* task's live log from (already-completed tasks'
    # logs are read straight off the shared cd_etl_airflow_home volume
    # instead). Docker's default random per-container hostname wouldn't
    # resolve from the cd-etl-api-server container. Port 8793 is that
    # log-serving port -- doesn't need `ports:` (only publishes to the
    # host), just needs to be reachable from other containers on this
    # compose network, which it already is by default.
    hostname: cd-etl-scheduler
    expose:
      - "8793"
    depends_on:
      cd-etl-migrate:
        condition: service_completed_successfully
      # Task subprocesses this forks talk to the Execution API below --
      # waiting for api-server to report healthy first (not just started)
      # avoids the first few tasks of a fresh `docker compose up` racing
      # api-server's own bootstrap and failing their first supervisor
      # contact.
      cd-etl-api-server:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow_metadata
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY}
      # Task subprocesses this scheduler forks (LocalExecutor) talk to the
      # api-server's Execution API instead of the metadata DB directly --
      # defaults to localhost, which won't reach another container.
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://cd-etl-api-server:8080/execution/
      # The only component that needs this: LocalExecutor runs task code
      # (including DB access inside @task bodies) as a subprocess of the
      # scheduler itself, not a separate worker -- api-server, triggerer,
      # and dag-processor never execute task code, so they never touch
      # this connection.
      AIRFLOW_CONN_CONGRESSIONAL_POSTGRES: postgresql://postgres:postgres@postgres:5432/congressional_app
      # See cd-etl-api-server's own comment -- module-import-time
      # requirement of every DAG file, not just a task-execution one.
      CONGRESS_API_KEY: ${CONGRESS_API_KEY}
    volumes:
      - ./cd-etl/src:/app/src
      - cd_etl_airflow_home:/app/.airflow
    healthcheck:
      test: ["CMD", "uv", "run", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cd-etl-triggerer:
    image: cd-etl:dev
    build:
      context: ./cd-etl
      dockerfile: docker/Dockerfile
      target: development
    command: ["uv", "run", "airflow", "triggerer"]
    restart: unless-stopped
    depends_on:
      cd-etl-migrate:
        condition: service_completed_successfully
      # See cd-etl-scheduler's own comment.
      cd-etl-api-server:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow_metadata
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://cd-etl-api-server:8080/execution/
      # See cd-etl-api-server's own comment -- module-import-time
      # requirement of every DAG file.
      CONGRESS_API_KEY: ${CONGRESS_API_KEY}
    volumes:
      - ./cd-etl/src:/app/src
      - cd_etl_airflow_home:/app/.airflow
    healthcheck:
      test: ["CMD", "uv", "run", "airflow", "jobs", "check", "--job-type", "TriggererJob", "--local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cd-etl-dag-processor:
    image: cd-etl:dev
    build:
      context: ./cd-etl
      dockerfile: docker/Dockerfile
      target: development
    command: ["uv", "run", "airflow", "dag-processor"]
    restart: unless-stopped
    depends_on:
      cd-etl-migrate:
        condition: service_completed_successfully
      # See cd-etl-scheduler's own comment.
      cd-etl-api-server:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow_metadata
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://cd-etl-api-server:8080/execution/
      # See cd-etl-api-server's own comment -- this is the component that
      # actually hit this at parse time (dag-processor imports every DAG
      # file to extract its DAG objects).
      CONGRESS_API_KEY: ${CONGRESS_API_KEY}
    volumes:
      - ./cd-etl/src:/app/src
      - cd_etl_airflow_home:/app/.airflow
    healthcheck:
      test: ["CMD", "uv", "run", "airflow", "jobs", "check", "--job-type", "DagProcessorJob", "--local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  cd_etl_airflow_home:
