name: cd-etl tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres
        run: docker compose up -d postgres

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development image (cached)
        uses: docker/build-push-action@v6
        with:
          context: cd-etl
          file: cd-etl/docker/Dockerfile
          target: development
          tags: cd-etl:dev
          load: true
          cache-from: type=gha,scope=cd-etl-development
          cache-to: type=gha,mode=max,scope=cd-etl-development

      - name: Run tests
        run: make test-etl

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U postgres && break
            sleep 1
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (cached)
        uses: docker/build-push-action@v6
        with:
          context: cd-etl
          file: cd-etl/docker/Dockerfile
          target: production
          tags: cd-etl:production
          load: true
          cache-from: type=gha,scope=cd-etl-production
          cache-to: type=gha,mode=max,scope=cd-etl-production

      - name: Smoke test production image
        run: |
          POSTGRES_CID=$(docker compose ps -q postgres)
          # entrypoint.sh no longer has a no-args "standalone" fallback --
          # Airflow's components each run as their own service now (see
          # docker-compose.yml), not bundled sibling subprocesses of one
          # process (rchacon/cd-infra#22). Mirrors that here: migrate
          # explicitly first, then start api-server as the smoke target
          # (matches an actual real invocation of this image).
          FERNET_KEY=$(python3 -c "import secrets, base64; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())")
          COMMON_ENV=(
            -e CONGRESS_API_KEY=smoke-test
            -e AIRFLOW_CONN_CONGRESSIONAL_POSTGRES=postgresql://postgres:postgres@localhost:5432/congressional_app
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@localhost:5432/airflow_metadata
            -e AIRFLOW__API_AUTH__JWT_SECRET=smoke-test-jwt-secret
            -e AIRFLOW__CORE__FERNET_KEY="$FERNET_KEY"
            -e AIRFLOW__API__SECRET_KEY=smoke-test-api-secret-key
          )

          docker run --rm --network container:$POSTGRES_CID "${COMMON_ENV[@]}" cd-etl:production migrate

          docker run --rm -d --name cd-etl-smoke \
            --network container:$POSTGRES_CID "${COMMON_ENV[@]}" \
            cd-etl:production uv run airflow api-server

          healthy=false
          for i in $(seq 1 60); do
            if docker exec cd-etl-smoke uv run python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)" 2>/dev/null; then
              healthy=true
              break
            fi
            sleep 3
          done

          # Always visible, success or failure -- api-server's own stdout is
          # otherwise only reachable via `docker logs`, and an assertion
          # failing below would otherwise exit (set -e) before ever
          # printing it.
          echo "::group::cd-etl-smoke container logs"
          docker logs cd-etl-smoke
          echo "::endgroup::"

          if [ "$healthy" != "true" ]; then
            echo "::error::api-server never responded to a health check"
            docker rm -f cd-etl-smoke
            exit 1
          fi

          docker exec cd-etl-smoke uv run airflow dags list | grep -q congress_members_etl

          docker rm -f cd-etl-smoke
