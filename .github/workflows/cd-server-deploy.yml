name: cd-server deploy

on:
  push:
    tags:
      - 'cd-server-v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag version matches pyproject.toml
        id: version
        run: scripts/check-tag-version.sh "$GITHUB_REF_NAME" cd-server-v cd-server/pyproject.toml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cd-server/docker/Dockerfile
          target: production
          push: true
          build-args: |
            CD_SERVER_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cd-server:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/cd-server:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # cd-platform-cd-server-deploy gained ecs:RunTask / ecs:DescribeTasks
          # / ecs:StopTask / iam:PassRole for the migrate task in cd-infra#68.
          role-to-assume: arn:aws:iam::658430303091:role/cd-platform-cd-server-deploy
          aws-region: us-west-2

      # Migrations run once here, not in every service task -- the long-running
      # task sets CD_SERVER_MIGRATE_TASK=1 so entrypoint.sh skips the on-boot
      # `alembic upgrade head` (cd-platform#133 / cd-infra#68). A failed
      # migration stops the workflow before the service is redeployed against a
      # stale schema. Mirrors cd-etl-deploy.yml.
      - name: Run migration task
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster cd-platform-cd-server \
            --task-definition cd-platform-cd-server-migrate \
            --launch-type EC2 \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::run-task returned no task (no EC2 capacity for the migrate task?)"
            exit 1
          fi
          # `wait` polls for up to ~10 min (6s x 100). If the task is still
          # running after that, stop it -- otherwise it could go on to apply
          # `alembic upgrade head` after this workflow has already bailed,
          # leaving the schema ahead of the still-old service tasks.
          if ! aws ecs wait tasks-stopped --cluster cd-platform-cd-server --tasks "$TASK_ARN"; then
            echo "::error::migrate task did not stop within the wait window; stopping it"
            aws ecs stop-task --cluster cd-platform-cd-server --task "$TASK_ARN" \
              --reason "cd-server-deploy wait timed out" >/dev/null || true
            exit 1
          fi
          # Require EVERY container to have exited exactly 0. Not
          # `containers[0].exitCode`: describe-tasks doesn't guarantee
          # container order matches the task def, so a zero-exit log sidecar
          # at index 0 could mask a failed migrate. The JMESPath filter
          # `exitCode != `0`` also matches a container with NO exitCode at
          # all (killed / never started -- `null != 0` is true), which a
          # `containers[].exitCode` projection would instead silently drop.
          UNCLEAN=$(aws ecs describe-tasks --cluster cd-platform-cd-server --tasks "$TASK_ARN" \
            --query 'length(tasks[0].containers[?exitCode!=`0`])' --output text)
          if [ "$UNCLEAN" != "0" ]; then
            echo "::error::migration task did not complete cleanly:"
            aws ecs describe-tasks --cluster cd-platform-cd-server --tasks "$TASK_ARN" \
              --query 'tasks[0].containers[].{name:name,exitCode:exitCode,reason:reason}' \
              --output table
            exit 1
          fi

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster cd-platform-cd-server \
            --service cd-platform-cd-server \
            --force-new-deployment

      # update-service returns as soon as the new deployment is *started*.
      # Wait for the rolling deploy to finish (only the new task left in
      # service) so the check below hits the image this run just shipped,
      # not the old one. Polls up to ~10 min (15s x 40); DescribeServices
      # is already on cd-platform-cd-server-deploy.
      - name: Wait for the service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster cd-platform-cd-server \
            --services cd-platform-cd-server

      # /v1 (cd-api's REST API, cd.api) must only be reachable through API
      # Gateway, which enforces X-Api-Key and adds the X-Origin-Verify secret
      # OriginGuard checks. A request straight to cd-server's own hostname
      # carries no such header, so it must get OriginGuard's 403 -- anything
      # else (a 200 especially) means /v1 is being served without an API key.
      # Checks the problem+json body too, so a 403 from something other than
      # OriginGuard doesn't pass by accident. Retried for ~2 min: the ALB can
      # still route to the draining old task (30s deregistration delay) just
      # after the service reports stable.
      - name: Verify /v1 is not reachable directly on server.civicdog.com
        run: |
          URL=https://server.civicdog.com/v1/version
          for i in $(seq 1 12); do
            CODE=$(curl -s -o body.json -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "403" ] && jq -e '.status == 403' body.json >/dev/null 2>&1; then
              echo "ok: $URL -> 403 (OriginGuard)"
              exit 0
            fi
            echo "attempt $i: $URL -> $CODE, retrying"
            sleep 10
          done
          echo "::error::$URL returned $CODE, expected OriginGuard's 403 -- /v1 may be reachable without an API key"
          cat body.json || true
          exit 1
