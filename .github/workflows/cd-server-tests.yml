name: cd-server tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres
        run: docker compose up -d postgres

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cd-server/docker/Dockerfile
          target: development
          tags: cd-server:dev
          load: true
          cache-from: type=gha,scope=cd-server-development
          cache-to: type=gha,mode=max,scope=cd-server-development

      - name: Run tests
        run: make test-server

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U postgres && break
            sleep 1
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cd-server/docker/Dockerfile
          target: production
          tags: cd-server:production
          load: true
          cache-from: type=gha,scope=cd-server-production
          cache-to: type=gha,mode=max,scope=cd-server-production

      - name: Smoke test production image
        run: |
          # --network container:$POSTGRES_CID (not standalone -p 8000:8000)
          # -- now that the entrypoint unconditionally runs `alembic
          # upgrade head`, this needs a reachable Postgres to start at
          # all. PG* env vars deliberately omitted -- settings.py's
          # defaults (PGHOST=localhost, PGDATABASE=cd_customers,
          # PGUSER/PGPASSWORD=postgres) already match this
          # network-namespace-shared postgres service, same trick
          # cd-etl-tests.yml's own smoke test already uses.
          # CD_SERVER_ENVIRONMENT/COGNITO_* are also unset -- defaults to
          # "local", disabling JWT verification, same zero-AWS-setup
          # posture as local dev.
          POSTGRES_CID=$(docker compose ps -q postgres)
          docker run --rm -d --name cd-server-smoke \
            --network container:$POSTGRES_CID \
            cd-server:production

          # No published port to curl from the runner anymore (-p and
          # --network container:X are mutually exclusive, and this slim
          # image has no `curl` either) -- every check below runs via
          # `docker exec` + Python's own urllib instead, same as
          # cd-etl-tests.yml's own smoke test does for the identical
          # reason.
          healthy=false
          for i in $(seq 1 30); do
            docker exec cd-server-smoke uv run python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" \
              2>/dev/null && { healthy=true; break; }
            sleep 1
          done

          echo "::group::cd-server-smoke container logs"
          docker logs cd-server-smoke
          echo "::endgroup::"

          if [ "$healthy" != "true" ]; then
            echo "::error::cd-server never responded to a health check"
            docker rm -f cd-server-smoke
            exit 1
          fi

          docker exec cd-server-smoke uv run python -c "
          import json
          import urllib.request

          def post(query):
              req = urllib.request.Request(
                  'http://localhost:8000/graphql',
                  data=json.dumps({'query': query}).encode(),
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              return urllib.request.urlopen(req).read().decode()

          assert '\"version\"' in post('{ version }')

          with urllib.request.urlopen('http://localhost:8000/version') as r:
              assert b'\"version\"' in r.read()

          # Introspection must be off on the production image (schema.py
          # only adds DisableIntrospection when GRAPHIQL_ENABLED is unset,
          # which is the case here -- this image was built without it).
          assert 'introspection has been disabled' in post('{ __schema { queryType { name } } }')
          "

          docker rm -f cd-server-smoke
