name: cd-api tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cd-api
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres
        working-directory: ${{ github.workspace }}
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U postgres && break
            sleep 1
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Apply migrations
        working-directory: cd-etl
        env:
          # cd-api's tests target the dedicated test database
          # (cd-platform#16, see cd-api/tests/conftest.py) -- apply
          # migrations there, not the real dev database.
          PGDATABASE: congressional_app_test
        run: |
          # --no-project skips cd-etl's own lockfile (pulling in the
          # entire apache-airflow dependency tree cd-api's tests have no
          # need for) -- migrations/env.py has no ORM models and no
          # import on cd-etl's own src, so alembic+psycopg2 (via
          # SQLAlchemy's postgresql+psycopg2 dialect) is all this needs.
          uv run --no-project --with alembic --with psycopg2-binary alembic upgrade head

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest tests/ -v
