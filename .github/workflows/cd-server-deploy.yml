name: cd-server deploy

on:
  push:
    tags:
      - 'cd-server-v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag version matches pyproject.toml
        id: version
        run: scripts/check-tag-version.sh "$GITHUB_REF_NAME" cd-server-v cd-server/pyproject.toml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cd-server/docker/Dockerfile
          target: production
          push: true
          build-args: |
            CD_SERVER_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cd-server:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/cd-server:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # cd-platform-cd-server-deploy gained ecs:RunTask / ecs:DescribeTasks
          # / iam:PassRole for the migrate task in cd-infra#67 (#68).
          role-to-assume: arn:aws:iam::658430303091:role/cd-platform-cd-server-deploy
          aws-region: us-west-2

      # Migrations run once here, not in every service task -- the long-running
      # task sets CD_SERVER_MIGRATE_TASK=1 so entrypoint.sh skips the on-boot
      # `alembic upgrade head` (cd-server#133 / cd-infra#67). A failed migration
      # stops the workflow before the service is redeployed against a stale
      # schema. Mirrors cd-etl-deploy.yml.
      - name: Run migration task
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster cd-platform-cd-server \
            --task-definition cd-platform-cd-server-migrate \
            --launch-type EC2 \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::run-task returned no task (no EC2 capacity for the migrate task?)"
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster cd-platform-cd-server --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster cd-platform-cd-server --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration task failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster cd-platform-cd-server \
            --service cd-platform-cd-server \
            --force-new-deployment
