[project]
name = "cd-lib"
version = "0.1.0"
description = "Shared code for cd-platform's Python services (cd-api, cd-etl, cd-server)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cd"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
