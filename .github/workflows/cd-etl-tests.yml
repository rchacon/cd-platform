name: cd-etl tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres
        run: docker compose up -d postgres

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development image (cached)
        uses: docker/build-push-action@v6
        with:
          context: cd-etl
          file: cd-etl/docker/Dockerfile
          target: development
          tags: cd-etl:dev
          load: true
          cache-from: type=gha,scope=cd-etl-development
          cache-to: type=gha,mode=max,scope=cd-etl-development

      - name: Run tests
        run: make test-etl

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U postgres && break
            sleep 1
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (cached)
        uses: docker/build-push-action@v6
        with:
          context: cd-etl
          file: cd-etl/docker/Dockerfile
          target: production
          tags: cd-etl:production
          load: true
          cache-from: type=gha,scope=cd-etl-production
          cache-to: type=gha,mode=max,scope=cd-etl-production

      - name: Smoke test production image
        run: |
          POSTGRES_CID=$(docker compose ps -q postgres)
          docker run --rm -d --name cd-etl-smoke \
            --network container:$POSTGRES_CID \
            -e CONGRESS_API_KEY=smoke-test \
            -e AIRFLOW_ADMIN_PASSWORD=smoke-test \
            -e AIRFLOW_CONN_CONGRESSIONAL_POSTGRES=postgresql://postgres:postgres@localhost:5432/congressional_app \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@localhost:5432/airflow_metadata \
            cd-etl:production

          for i in $(seq 1 30); do
            docker exec cd-etl-smoke uv run python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health')" \
              && break
            sleep 2
          done

          docker exec cd-etl-smoke uv run airflow dags list | grep -q congress_members_etl

          # SimpleAuthManager is no longer active -- confirm it never
          # auto-provisioned its own generated-password file.
          docker exec cd-etl-smoke sh -c \
            '[ ! -e /app/.airflow/simple_auth_manager_passwords.json.generated ]'

          docker logs cd-etl-smoke
          docker rm -f cd-etl-smoke
